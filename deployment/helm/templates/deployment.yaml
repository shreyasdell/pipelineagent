apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.deployment.name }}
    model: {{ include "sglang-model-serving.sanitizeLabel" .Values.model.id }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.name }}
        model: {{ include "sglang-model-serving.sanitizeLabel" .Values.model.id }}
    spec:
      runtimeClassName: {{ .Values.deployment.runtimeClass }}
      containers:
      - name: sglang-server
        image: {{ .Values.container.image }}
        command: {{ .Values.container.command | toJson }}
        args: {{ .Values.container.args | toJson }}
        env:
        - name: MODEL_ID
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.configMap.name }}
              key: MODEL_ID
        - name: MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.configMap.name }}
              key: MODEL_PATH
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.configMap.name }}
              key: PORT
        - name: HOST
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.configMap.name }}
              key: HOST
{{- range .Values.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
{{- end }}
        ports:
        - containerPort: {{ .Values.container.port }}
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
            nvidia.com/gpu: {{ .Values.resources.requests.nvidiaGpu | default 1 }}
          limits:
            nvidia.com/gpu: {{ .Values.resources.limits.nvidiaGpu | default 1 }}
        volumeMounts:
        - name: model-storage
          mountPath: /models
        livenessProbe:
          httpGet:
            path: {{ .Values.healthCheck.livenessProbe.path }}
            port: {{ .Values.container.port }}
          initialDelaySeconds: {{ .Values.healthCheck.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthCheck.livenessProbe.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.healthCheck.readinessProbe.path }}
            port: {{ .Values.container.port }}
          initialDelaySeconds: {{ .Values.healthCheck.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthCheck.readinessProbe.periodSeconds }}
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: {{ .Values.pvc.name }}
