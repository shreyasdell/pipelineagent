# Values for Microsoft Phi-3-mini-4k-instruct
model:
  id: "microsoft/Phi-3-mini-4k-instruct"
  name: "phi-3-mini-4k-instruct"
  storagePath: "/models/phi3-mini"

deployment:
  name: "phi-3-mini-4k-instruct"
  replicas: 1
  runtimeClass: nvidia

container:
  image: lmsysorg/sglang:latest
  command: ["python", "-m", "sglang.launch_server"]
  args:
    - "--model-path"
    - "$(MODEL_PATH)"
    - "--port"
    - "$(PORT)"
    - "--host"
    - "$(HOST)"
  port: 8000

resources:
  requests:
    cpu: 4
    memory: 16Gi
    nvidiaGpu: 1
  limits:
    nvidiaGpu: 1

service:
  name: "phi-3-mini-4k-instruct-service"
  type: ClusterIP
  port: 8000
  targetPort: 8000

pvc:
  name: "phi-3-mini-4k-instruct-models-pvc"
  size: 50Gi
  accessModes:
    - ReadWriteOnce

configMap:
  name: "phi-3-mini-4k-instruct-config"
  data:
    MODEL_ID: "microsoft/Phi-3-mini-4k-instruct"
    MODEL_PATH: "/models/phi3-mini"
    PORT: "8000"
    HOST: "0.0.0.0"

namespace:
  name: "sglang-serving"
  create: true

healthCheck:
  livenessProbe:
    path: /health
    initialDelaySeconds: 60
    periodSeconds: 30
  readinessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

env:
  - name: NVIDIA_VISIBLE_DEVICES
    value: "all"
