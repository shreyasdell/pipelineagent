# Helm values for gradium/phonon-31m-en
# Generated by AgenticPipeline Kubernetes Deployment Agent

model:
  id: "gradium/phonon-31m-en"
  name: "gradium-phonon-31m-en"
  storagePath: "/models/gradium/phonon-31m-en"

deployment:
  name: "phonon-31m-en"
  replicas: 1
  runtimeClass: nvidia

container:
  image: lmsysorg/sglang:latest
  command: ["python", "-m", "sglang.launch_server"]
  args:
    - "--model-path"
    - "$(MODEL_PATH)"
    - "--port"
    - "$(PORT)"
    - "--host"
    - "$(HOST)"
  port: 8000

resources:
  requests:
    cpu: 2
    memory: 8Gi
    nvidiaGpu: 1
  limits:
    nvidiaGpu: 1

service:
  name: "phonon-31m-en-service"
  type: NodePort
  port: 8000
  targetPort: 8000
  nodePort: 30080

pvc:
  name: "phonon-31m-en-models-pvc"
  size: 50Gi
  accessModes:
    - ReadWriteOnce

configMap:
  name: "phonon-31m-en-config"
  data:
    MODEL_ID: "gradium/phonon-31m-en"
    MODEL_PATH: "/models/gradium/phonon-31m-en"
    PORT: "8000"
    HOST: "0.0.0.0"

namespace:
  name: "sglang-deployments"
  create: true

healthCheck:
  livenessProbe:
    path: /health
    initialDelaySeconds: 60
    periodSeconds: 30
  readinessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

env:
  - name: NVIDIA_VISIBLE_DEVICES
    value: "all"
