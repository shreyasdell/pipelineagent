# Values for Google EmbeddingGemma-2
model:
  id: "google/embeddinggemma-2"
  name: "sglang-deployment"
  storagePath: "/models/phi3-mini"

deployment:
  name: "sglang-deployment"
  replicas: 1
  runtimeClass: nvidia

container:
  image: lmsysorg/sglang:latest
  command: ["python", "-m", "sglang.launch_server"]
  args:
    - "--model-path"
    - "$(MODEL_PATH)"
    - "--port"
    - "$(PORT)"
    - "--host"
    - "$(HOST)"
  port: 8000

resources:
  requests:
    cpu: 2
    memory: 8Gi
    nvidiaGpu: 1
  limits:
    nvidiaGpu: 1

service:
  name: "sglang-service"
  type: ClusterIP
  port: 8000
  targetPort: 8000

pvc:
  name: "sglang-deployment-models-pvc"
  size: 50Gi
  accessModes:
    - ReadWriteOnce

configMap:
  name: "sglang-deployment-config"
  data:
    MODEL_ID: "google/embeddinggemma-2"
    MODEL_PATH: "/models/phi3-mini"
    PORT: "8000"
    HOST: "0.0.0.0"

namespace:
  name: "sglang-deploy"
  create: true

healthCheck:
  livenessProbe:
    path: /health
    initialDelaySeconds: 60
    periodSeconds: 30
  readinessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

env:
  - name: NVIDIA_VISIBLE_DEVICES
    value: "all"
