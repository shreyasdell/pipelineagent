# Helm values for nineninesix/tyger
# Generated by AgenticPipeline Kubernetes Deployment Agent

model:
  id: "nineninesix/tyger"
  name: "nineninesix-tyger"
  storagePath: "models/nineninesix/tyger"

deployment:
  name: "nineninesix-tyger"
  replicas: 1
  runtimeClass: nvidia

container:
  image: lmsysorg/sglang:latest
  command: ["python", "-m", "sglang.launch_server"]
  args:
    - "--model-path"
    - "$(MODEL_PATH)"
    - "--port"
    - "$(PORT)"
    - "--host"
    - "$(HOST)"
  port: 8000

resources:
  requests:
    cpu: 2
    memory: 8Gi
    nvidiaGpu: 1
  limits:
    nvidiaGpu: 1

service:
  name: "nineninesix-tyger-service"
  type: NodePort
  port: 8000
  targetPort: 8000
  nodePort: 30080

pvc:
  name: "nineninesix-tyger-models-pvc"
  size: 50Gi
  accessModes:
    - ReadWriteOnce

configMap:
  name: "nineninesix-tyger-config"
  data:
    MODEL_ID: "nineninesix/tyger"
    MODEL_PATH: "models/nineninesix/tyger"
    PORT: "8000"
    HOST: "0.0.0.0"

namespace:
  name: "sglang-deploy"
  create: true

healthCheck:
  livenessProbe:
    path: /health
    initialDelaySeconds: 60
    periodSeconds: 30
  readinessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

env:
  - name: NVIDIA_VISIBLE_DEVICES
    value: "all"
