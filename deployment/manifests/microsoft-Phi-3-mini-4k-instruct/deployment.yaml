apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-deployment
  namespace: sglang-deploy
  labels:
    app: sglang-deployment
    model: microsoft/Phi-3-mini-4k-instruct
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sglang-deployment
  template:
    metadata:
      labels:
        app: sglang-deployment
        model: microsoft/Phi-3-mini-4k-instruct
    spec:
      runtimeClassName: nvidia
      containers:
      - name: sglang-server
        image: lmsysorg/sglang:latest
        command: ["python", "-m", "sglang.launch_server"]
        args: [
          "--model-path", "$(MODEL_PATH)",
          "--port", "$(PORT)",
          "--host", "$(HOST)"
        ]
        env:
        - name: MODEL_ID
          valueFrom:
            configMapKeyRef:
              name: sglang-deployment-config
              key: MODEL_ID
        - name: MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: sglang-deployment-config
              key: MODEL_PATH
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: sglang-deployment-config
              key: PORT
        - name: HOST
          valueFrom:
            configMapKeyRef:
              name: sglang-deployment-config
              key: HOST
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 4
            memory: 16Gi
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1
        volumeMounts:
        - name: model-storage
          mountPath: /models
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: sglang-deployment-models-pvc
