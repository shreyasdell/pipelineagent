apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-phi4-mini
  namespace: model-serving
  labels:
    app: vllm-phi4-mini
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-phi4-mini
  template:
    metadata:
      labels:
        app: vllm-phi4-mini
    spec:
      runtimeClassName: nvidia
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        ports:
        - containerPort: 8000
        env:
        - name: VLLM_DISABLE_COMPILE_CACHE
          value: "1"
        command:
        - vllm
        - serve
        - microsoft/Phi-3-mini-4k-instruct
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        - --gpu-memory-utilization
        - "0.8"
        - --max-model-len
        - "2048"
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
          limits:
            cpu: "4"
            memory: "16Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
