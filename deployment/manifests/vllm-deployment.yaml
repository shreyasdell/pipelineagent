apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-phi4-mini
  namespace: model-serving
  labels:
    app: vllm-phi4-mini
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-phi4-mini
  template:
    metadata:
      labels:
        app: vllm-phi4-mini
    spec:
      runtimeClassName: nvidia
      initContainers:
      - name: install-ca
        image: debian:12-slim
        command:
        - sh
        - -c
        - |
          apt-get update && apt-get install -y ca-certificates
          mkdir -p /usr/local/share/ca-certificates
          cp /certs/dell-ca.crt /usr/local/share/ca-certificates/dell-ca.crt
          update-ca-certificates
        volumeMounts:
        - name: dell-ca
          mountPath: /certs/dell-ca.crt
          subPath: dell-ca.crt
        - name: ca-store
          mountPath: /etc/ssl/certs
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.6.3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: VLLM_DISABLE_COMPILE_CACHE
          value: "1"
        command:
        - vllm
        - serve
        - microsoft/Phi-3-mini-4k-instruct
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        - --gpu-memory-utilization
        - "0.8"
        - --max-model-len
        - "2048"
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
          limits:
            cpu: "4"
            memory: "16Gi"
        volumeMounts:
        - name: ca-store
          mountPath: /etc/ssl/certs
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
      volumes:
      - name: dell-ca
        configMap:
          name: dell-ca-config
      - name: ca-store
        emptyDir: {}
