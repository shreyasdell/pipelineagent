apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: model-serving
subsets:
  - addresses:
    - 172.24.52.99  # MicroK8s node IP (host)
    ports:
    - port: 11434
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: model-serving
spec:
  ports:
  - port: 11434
    targetPort: 11434
  type: ClusterIP
