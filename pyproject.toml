[tool.poetry]
name = "agentic-pipeline"
version = "0.1.0"
description = "Agentic AI system for automated model deployment and inferencing"
authors = ["Shreyas.DK@dell.com"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
langchain = "^0.1.0"
langchain-openai = "^0.0.5"
langchain-ollama = "^0.1.0"
langgraph = "^0.0.20"
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.25"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
httpx = "^0.26.0"
python-dotenv = "^1.0.0"
loguru = "^0.7.2"
prometheus-client = "^0.19.0"
github3.py = "^4.0.0"
requests = "^2.31.0"
vllm = "^0.6.0"
huggingface-hub = "^0.23.0"
kubernetes = "^29.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.0"
black = "^24.1.0"
ruff = "^0.1.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true